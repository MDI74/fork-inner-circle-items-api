# main part of the workflow was taken from https://github.com/gman-au/not-again/blob/master/.github/workflows/siren-gen.yml
name: No pending migrations

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # need to execute only when migrations changed
    # paths:
    #   - '**/Entities/**'
    #   - '**/AppDbContext/**'

jobs:
  check-pending-migrations:
    runs-on: ubuntu-24.04
    steps:
    - name: Check out the repo
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build application
      uses: devcontainers/ci@v0.3
      with:
        imageName: ghcr.io/${{ env.DEV_CONTAINER_IMAGE }}
        cacheFrom: ghcr.io/${{ env.DEV_CONTAINER_IMAGE }}
        runCmd: |
          dotnet build

          dotnet ef migrations add CheckPendingMigration \
              --startup-project ./Api/Api.csproj \
              --project ./Application/Application.csproj \
              --context AppDbContext \
              --verbose
        # in the first step that runs inside Dev Container we push the image we built to re-use it in the next steps
        # we newer push in the next steps, only use the cache if available
        push: never
    